<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小球的小屋与庄园｜Yuki</title>
  <meta name="description" content="在暖暖的小屋里揉揉小球，推开门，到有风的庄园里玩耍。">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/pet-world.css">
</head>
<body>
  <main id="world">
    <h1 class="accessible">小球的小屋与庄园</h1>
    <nav class="accessible" aria-label="小球互动的键盘操作">
      <a href="index.html">返回首页</a>
      <button data-world-toggle>去庄园</button>
      <button data-time-next>切换时刻（T），也可点击场景钟面</button>
      <button data-time-pause>暂停或继续昼夜（P），也可点击钟旁圆钮</button>
      <button data-grab>抓取小球，方向键调整，空格释放</button>
      <button data-action="feed">喂食</button>
      <button data-action="pet">摸摸</button>
      <button data-action="play">玩耍</button>
      <button data-action="sleep">休息</button>
      <button data-action="clean">清洁</button>
    </nav>
    <p class="accessible" id="status" role="status"></p>
  </main>
  <div id="loading"><p>小屋里亮起了一盏灯……</p><noscript>开启 JavaScript 后可以进入小屋。<a href="index.html">返回首页</a></noscript></div>
  <script src="assets/js/pet-storage.js"></script>
  <script type="module" src="assets/js/pet-world-entry.js?v=daynight1"></script>
</body>
</html>
